name: Expire rooms
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove rooms older than 24 hours
        run: >-
          curl --fail --show-error --silent --retry 3 --retry-delay 10
          --max-time 90 --request POST
          --header 'Origin: https://knotleaf-desk.vercel.app'
          https://excalidraw-tl7h.onrender.com/api/rooms/cleanup
